name: Infrastructure

on:
  push:
    paths:
      - "infrastructure/**"
      - ".github/workflows/deploy-infrastructure.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref (latest push wins).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# AWS auth uses OIDC to assume the codesistance-github-terraform role (id-token permission below).
# The Terraform state backend (S3 bucket + DynamoDB lock table) is bootstrapped by the step below.
permissions:
  id-token: write
  contents: read

env:
  TF_VAR_FILE: ../environment/production.tfvars

jobs:
  # ── CI: validate + plan on every relevant change (push, PR, dispatch) ──────────
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Load CI env
        run: cat .github/ci.env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Ensure the remote-state backend exists before init (idempotent: creates if
      # missing, otherwise reports). This workflow is the single owner of the backend.
      - name: Bootstrap Terraform backend (S3 + DynamoDB)
        run: bash infrastructure/scripts/bootstrap-tf-backend.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform plan
        working-directory: infrastructure/deployment
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="region=${AWS_REGION}"
          terraform fmt -check -recursive
          terraform validate
          terraform plan -var-file="$TF_VAR_FILE"

  # ── CD: apply only on main, after plan passes ──────────────────────────────────
  apply:
    name: Terraform apply
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Load CI env
        run: cat .github/ci.env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap Terraform backend (S3 + DynamoDB)
        run: bash infrastructure/scripts/bootstrap-tf-backend.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      # Task definitions reference the stable ":production" image tag, so apply manages
      # infrastructure/topology only — image rollout is driven by the backend workflow.
      - name: Terraform apply
        working-directory: infrastructure/deployment
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -auto-approve -var-file="$TF_VAR_FILE"
