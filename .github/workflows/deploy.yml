name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# AWS auth uses OIDC to assume the codesistance-github-terraform role (id-token permission below).
# Region and role ARN are pinned below. Other required repo config:
#   vars.TF_BACKEND_BUCKET, vars.TF_BACKEND_DYNAMODB_TABLE
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_VAR_FILE: ../environment/production.tfvars

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::776051123142:role/codesistance-github-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      # ── Build & push images (tag = commit SHA) ────────────────────────────────
      - name: Build & push API and Worker images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          API_REPO="$REGISTRY/voltscrm-production-api"
          WORKER_REPO="$REGISTRY/voltscrm-production-worker"
          docker build -f src/backend/api/VoltsCRM.API/Dockerfile -t "$API_REPO:$TAG" .
          docker build -f src/backend/worker/VoltsCRM.Worker/Dockerfile -t "$WORKER_REPO:$TAG" .
          docker push "$API_REPO:$TAG"
          docker push "$WORKER_REPO:$TAG"

      # ── Terraform apply (rolls ECS services to the new image tags) ─────────────
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform apply
        working-directory: infrastructure/deployment
        env:
          TF_VAR_api_image_tag: ${{ github.sha }}
          TF_VAR_worker_image_tag: ${{ github.sha }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_BACKEND_DYNAMODB_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
          terraform apply -auto-approve -var-file="$TF_VAR_FILE"

      # ── Apply DB migrations via a one-off Fargate task inside the VPC ──────────
      - name: Run database migrations
        working-directory: infrastructure/deployment
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          TASKDEF=$(terraform output -raw api_task_definition_family)
          SG=$(terraform output -raw api_security_group_id)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASKDEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["migrate"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`api`].exitCode | [0]' --output text)
          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ]

      # ── Build & deploy the SPA ─────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/web/package-lock.json

      - name: Build & sync SPA
        working-directory: infrastructure/deployment
        run: |
          SPA_BUCKET=$(terraform output -raw spa_bucket)
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          ( cd "$GITHUB_WORKSPACE/src/frontend/web" && npm ci && npm run build )
          aws s3 sync "$GITHUB_WORKSPACE/src/frontend/web/dist/" "s3://$SPA_BUCKET/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
