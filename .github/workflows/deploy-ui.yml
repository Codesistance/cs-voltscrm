name: Frontend

on:
  push:
    paths:
      - "src/frontend/web/**"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref (latest push wins).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# AWS auth uses OIDC to assume the codesistance-github-terraform role (id-token permission below).
# The state backend is created by the deploy-infrastructure workflow; here we only read outputs.
permissions:
  id-token: write
  contents: read

jobs:
  # ── CI: always runs (push, PR, dispatch) ───────────────────────────────────────
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      # CI build validates lint + typecheck + bundling. The deploy job rebuilds against the
      # deployed topology (VITE_API_BASE / VITE_REFRESH_IN_BODY from Terraform outputs).
      - run: npm run build

  # ── CD: deploy only on main, after build passes ────────────────────────────────
  deploy:
    name: Deploy SPA
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Load CI env
        run: cat .github/ci.env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Read resource names + topology from Terraform state (read-only, no apply) ─
      # The SPA must be built against the deployed topology: in the auto-FQDN branch it
      # calls the API cross-origin at an absolute URL and uses cookie-less refresh, so we
      # read the outputs first and bake them into the build (rather than reusing the CI artifact).
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform init (read outputs)
        working-directory: infrastructure/deployment
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="region=${AWS_REGION}"

      - name: Read Terraform outputs
        id: tf
        working-directory: infrastructure/deployment
        run: |
          {
            echo "spa_bucket=$(terraform output -raw spa_bucket)"
            echo "api_base_url=$(terraform output -raw api_base_url)"
            echo "use_custom_domain=$(terraform output -raw use_custom_domain)"
            echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id 2>/dev/null || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/web/package-lock.json

      - name: Build SPA against the deployed topology
        working-directory: src/frontend/web
        env:
          VITE_API_BASE: ${{ steps.tf.outputs.api_base_url }}
          # Cookie-less refresh whenever the custom-domain edge is off (cross-origin over HTTP).
          VITE_REFRESH_IN_BODY: ${{ steps.tf.outputs.use_custom_domain == 'false' }}
        run: |
          npm ci
          npm run build

      - name: Sync SPA to S3 & invalidate CloudFront
        env:
          SPA_BUCKET: ${{ steps.tf.outputs.spa_bucket }}
          # Empty in the auto-FQDN branch — the SPA bucket lives in AWS_REGION (eu-west-1), so the
          # S3 website endpoint and this sync both target it directly.
          DIST_ID: ${{ steps.tf.outputs.cloudfront_distribution_id }}
        run: |
          aws s3 sync "$GITHUB_WORKSPACE/src/frontend/web/dist/" "s3://$SPA_BUCKET/" --delete
          if [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          else
            echo "No CloudFront distribution (use_custom_domain=false) — skipping invalidation."
          fi
