name: Backend

on:
  push:
    paths:
      - "src/backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref (latest push wins).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# AWS auth uses OIDC to assume the codesistance-github-terraform role (id-token permission below).
# The state backend is created by the deploy-infrastructure workflow; here we only read outputs.
permissions:
  id-token: write
  contents: read

jobs:
  # ── CI: always runs (push, PR, dispatch) ───────────────────────────────────────
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build backend projects
        run: |
          for proj in \
            src/backend/api/VoltsCRM.API/VoltsCRM.API.csproj \
            src/backend/worker/VoltsCRM.Worker/VoltsCRM.Worker.csproj; do
            dotnet build "$proj" -c Release
          done

      # Integration tests spin up Postgres via Testcontainers (Docker is preinstalled on the runner).
      - name: Test
        run: |
          find tests -name '*.Tests.csproj' -print0 | while IFS= read -r -d '' proj; do
            dotnet test "$proj" -c Release --logger "trx;LogFileName=test-results.trx"
          done

  # ── CD: deploy only on main, after tests pass ──────────────────────────────────
  deploy:
    name: Deploy API/Worker
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Load CI env
        run: cat .github/ci.env >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      # ── Build & push images: pinned :<sha> + moving :production ────────────────
      # ECS task defs reference :production; Fargate always pulls fresh, so a
      # force-new-deployment below picks up this image.
      - name: Build & push API and Worker images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          API_REPO="$REGISTRY/voltscrm-production-api"
          WORKER_REPO="$REGISTRY/voltscrm-production-worker"
          docker build -f src/backend/api/VoltsCRM.API/Dockerfile -t "$API_REPO:$TAG" -t "$API_REPO:production" .
          docker build -f src/backend/worker/VoltsCRM.Worker/Dockerfile -t "$WORKER_REPO:$TAG" -t "$WORKER_REPO:production" .
          docker push "$API_REPO:$TAG"
          docker push "$API_REPO:production"
          docker push "$WORKER_REPO:$TAG"
          docker push "$WORKER_REPO:production"

      # ── Read resource names from Terraform state (read-only, no apply) ─────────
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Terraform init (read outputs)
        working-directory: infrastructure/deployment
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="region=${AWS_REGION}"

      # ── Apply DB migrations via a one-off Fargate task inside the VPC ──────────
      # Runs before the service roll so the schema is ready. The task def's
      # :production image was just pushed above, so this executes the new image.
      - name: Run database migrations
        working-directory: infrastructure/deployment
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          TASKDEF=$(terraform output -raw api_task_definition_family)
          SG=$(terraform output -raw api_security_group_id)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASKDEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["migrate"]}]}' \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`api`].exitCode | [0]' --output text)
          echo "Migration exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ]

      # ── Roll the ECS services onto the freshly pushed :production image ────────
      - name: Force new deployment
        working-directory: infrastructure/deployment
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          aws ecs update-service --cluster "$CLUSTER" --service voltscrm-production-api --force-new-deployment
          aws ecs update-service --cluster "$CLUSTER" --service voltscrm-production-worker --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services voltscrm-production-api voltscrm-production-worker
