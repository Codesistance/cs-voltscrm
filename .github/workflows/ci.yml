name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build backend projects
        run: |
          for proj in \
            src/backend/api/VoltsCRM.API/VoltsCRM.API.csproj \
            src/backend/worker/VoltsCRM.Worker/VoltsCRM.Worker.csproj; do
            dotnet build "$proj" -c Release
          done

      # Integration tests spin up Postgres via Testcontainers (Docker is preinstalled on the runner).
      - name: Test
        run: |
          find tests -name '*.Tests.csproj' -print0 | while IFS= read -r -d '' proj; do
            dotnet test "$proj" -c Release --logger "trx;LogFileName=test-results.trx"
          done

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
